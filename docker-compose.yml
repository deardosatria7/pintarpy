# App pintarpy. Postgres-nya dipakai bersama dengan finance-zenio dan
# didefinisikan di finance-zenio/docker-compose.yml, jadi jalankan itu dulu:
#
#   cd ../finance-zenio && docker compose up -d db
#   cd ../pintarpy      && docker compose up -d app

services:
  app:
    build: .
    container_name: pintarpy
    # Hanya loopback: cloudflared (service di host) bisa menjangkau,
    # tapi port tidak terbuka ke jaringan luar.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@shared-postgres:5432/zenio_pintarpy
      NODE_ENV: production
    env_file:
      - .env
    networks:
      - shared-net

networks:
  shared-net:
    external: true
    name: shared-net
